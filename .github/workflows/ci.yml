.
name: DevOps Dashboard CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Flask Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Flask tests
        run: python -m unittest discover -s tests -v

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            --tag devops-dashboard:${{ github.sha }} \
            .

  deploy:
    name: Deploy with Ansible
    runs-on: self-hosted
    needs: [test, docker]

    # Never deploy pull requests or branches other than main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Ansible installation
        run: ansible --version

      - name: Verify deployment SSH key
        run: |
          test -r "$HOME/.ssh/devops-control-node"
          chmod 600 "$HOME/.ssh/devops-control-node"

      - name: Install Ansible Docker collection
        run: ansible-galaxy collection install community.docker

      - name: Validate Ansible playbook
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml \
            --syntax-check

      - name: Deploy application
        run: |
          ansible-playbook \
            -i ansible/inventory.ini \
            ansible/deploy.yml

      - name: Verify deployed health endpoint
        run: |
          curl --fail --show-error --silent \
            --retry 5 \
            --retry-delay 3 \
            http://98.83.150.45:5000/health

